# Chronos: load the dilated-TSC module at boot.
# Installed to /etc/modules-load.d/chronos-tsc.conf by build_kernel.sh.
#
# custom_tsc's module_init creates /dev/shm/my-little-shared-memory (tmpfs, so
# it is gone after every reboot) and is what the slot checker mmaps. Loading it
# here is what makes the TSC chain survive a reboot without re-running setup.
custom_tsc
