# Chronos: custom_tsc must be loaded BEFORE kvm.
# Installed to /etc/modprobe.d/chronos-tsc.conf by build_kernel.sh.
#
# The module patches TSC handling underneath KVM, so a guest started while it is
# absent is never dilated. This softdep makes the ordering declarative instead of
# depending on the rmmod/insmod/modprobe sequence in build_kernel.sh, which only
# ever ran on first provision.
softdep kvm pre: custom_tsc
